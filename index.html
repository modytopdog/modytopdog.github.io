<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send Payment</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#fff;
    width:380px;
    max-width:90%;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;
}

h1{
    color:#007a3d;
    margin-bottom:10px;
}

.name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.iban{
    background:#f1f1f1;
    padding:12px;
    border-radius:8px;
    word-break:break-all;
    margin-bottom:15px;
    font-size:14px;
}

button,a{
    display:block;
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    color:white;
    font-size:16px;
}

.copy{
    background:#007a3d;
}

.whatsapp{
    background:#25D366;
}

button:hover,a:hover{
    opacity:.9;
}

.footer{
    margin-top:20px;
    color:#666;
    font-size:13px;
}
</style>

</head>
<body>

<div class="card">

<h1>Send Payment</h1>

<div class="name">
Mohamed Hamed Mahmoud
</div>

<div class="iban" id="iban">
SA6505012000000111147997
</div>

<button class="copy" onclick="copyIBAN()">
📋 Copy IBAN
</button>

<a class="whatsapp"
href="https://wa.me/966558540410?text=I%20have%20completed%20the%20bank%20transfer."
target="_blank">
✅ I've Completed the Transfer
</a>

<div class="footer">
Thank you for your payment.
</div>

</div>

<script>
function copyIBAN(){
    const iban=document.getElementById("iban").innerText;
    navigator.clipboard.writeText(iban);
    alert("IBAN copied successfully!");
}
</script>

</body>
</html>
